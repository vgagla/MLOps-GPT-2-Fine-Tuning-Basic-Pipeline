name: Learn GitHub Actions

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  explore-runner:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Inspect the runner
        run: |
          pwd
          ls -la
          python --version
